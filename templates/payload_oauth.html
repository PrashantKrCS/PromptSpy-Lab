<!DOCTYPE html>
<html>
<head>
    <title>Mock OAuth Consent Simulation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <div class="alert alert-warning">
        <strong>Security Awareness Simulation</strong><br>
        No authentication or authorization occurs on this page.
    </div>

    <div class="card">
        <div class="card-header">
            Simulated Permission Request
        </div>

        <div class="card-body">

            <h5>Requested Permissions</h5>

            <ul>
                <li>Read Mail</li>
                <li>Read Contacts</li>
                <li>Maintain Access</li>
            </ul>

            <button class="btn btn-success">
                Allow (Simulation)
            </button>

            <button class="btn btn-secondary">
                Deny
            </button>

        </div>
    </div>

</div>

</body>
</html>
